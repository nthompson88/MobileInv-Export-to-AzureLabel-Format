name: Build Windows EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore .\ItemNumberExtractor\ItemNumberExtractor.csproj

      - name: Publish single-file EXE (win-x64)
        run: |
          dotnet publish .\ItemNumberExtractor\ItemNumberExtractor.csproj `
            -c Release `
            -r win-x64 `
            --self-contained false `
            /p:PublishSingleFile=true `
            /p:DebugType=None `
            /p:DebugSymbols=false

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ItemNumberExtractor-win-x64
          path: .\ItemNumberExtractor\bin\Release\net8.0\win-x64\publish\
